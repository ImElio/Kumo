name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate version metadata
        shell: pwsh
        run: ./tools/check-version.ps1

      - name: Restore
        run: dotnet restore Kumo.slnx

      - name: Check formatting
        run: dotnet format whitespace Kumo.slnx --verify-no-changes

      - name: Build
        run: dotnet build Kumo.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Kumo.slnx -c Release --no-build

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
          }

      # Development builds are versioned <version>-dev.<run number>+<sha>, so later builds always sort higher. They
      # carry no update repository, never check for updates and are never published as releases.
      - name: Package development build
        shell: pwsh
        run: ./tools/package-release.ps1 -SourceRevision "${{ github.sha }}" -PrereleaseSuffix "dev.${{ github.run_number }}" -Runtimes win-x64 -OutDir artifacts/dev

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kumo-dev-${{ github.sha }}
          path: artifacts/dev
          retention-days: 14
          if-no-files-found: error
